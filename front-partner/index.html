<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <!-- static 下无图标资源（主理人端首轮不引图片资产，F-18.15 C-1），用内联 SVG data URI favicon 消除 /favicon.ico 404 报错，不发额外请求 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧺</text></svg>" />
    <script>try{var t=localStorage.getItem('app_theme');if(t==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
    <title>生鲜主理人端</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* 滚轮策略（照用户端 / 商家端 index.html）：此处锁死 html,body 滚动，页面级滚动页（工作台）的 PC 滚轮
         由页面内 #ifdef H5 wheel 兜底接管（workspace.vue / login.vue），此处不可放开 */
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        -webkit-overflow-scrolling: touch;
        /* P10-1 首屏背景兜底：预置脚本前移主题判定后，首帧直接按档位取底色，消除白闪 */
        background: #F7F6F3;
      }
      /* 深色档兜底（class 挂在 html，须选到 body 才能盖住浅色底） */
      html.dark body {
        background: #0A0A0B;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
