# ============================================================================
# 生鲜配送 Nginx 配置（M3-T-10 部署产出物，未实际部署）
# 用途：HTTPS 反向代理后端 + 前端静态资源托管 + 商品图片别名目录 + gzip 压缩
# 安装：
#   1. 证书放到下方 ssl_certificate 指向路径（当前为占位路径，需替换为真实证书）
#   2. cp deploy/nginx-fresh.conf /etc/nginx/conf.d/fresh.conf
#   3. mkdir -p /data/fresh/front /data/fresh/images
#      前端打包产物（uniapp H5 发行包）拷贝到 /data/fresh/front
#      商品图片（dish-<id>.svg 等）拷贝到 /data/fresh/images
#   4. nginx -t && nginx -s reload
# ============================================================================

# HTTP 全部 301 跳 HTTPS
server {
    listen 80;
    server_name fresh.example.com;   # 占位：替换为真实域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name fresh.example.com;   # 占位：替换为真实域名

    # ---- SSL 证书（占位路径，部署时替换为真实证书文件）----
    ssl_certificate     /etc/nginx/ssl/fresh.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/fresh.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- gzip 压缩：JS/CSS/JSON/SVG 等文本资源 ----
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml application/xml+rss
               text/javascript image/svg+xml;
    gzip_vary on;
    gzip_static on;

    # 请求体上限：管理端/评价等 JSON 请求，1m 足够
    client_max_body_size 1m;

    # ---- 后端 API 反向代理：/api/ → Spring Boot 3001（保留 /api 前缀，与后端路由一致）----
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # ---- 健康探活（可选）：透传 actuator 健康端点 ----
    location /actuator/health {
        proxy_pass http://127.0.0.1:3001/actuator/health;
        access_log off;
    }

    # ---- 商品图片静态目录：/static/images/ 别名到独立数据目录（与前端打包产物解耦，换图不重发版）----
    location /static/images/ {
        alias /data/fresh/images/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- 前端静态根：uniapp H5 打包产物 ----
    root /data/fresh/front;
    index index.html;

    # 前端路由回退：H5 history 模式刷新/直达时回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
