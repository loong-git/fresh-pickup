# 公共配置（T-M1-11）：与环境无关的部分；数据源按环境拆分到 application-dev.yml / application-prod.yml
server:
  port: 3001

spring:
  profiles:
    active: dev

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

# 字典服务上游配置（T-M2-07）：sk_ 密钥只存后端，前端一律走 /api/dict 代理，不再持有 key。
# 现值从 front/api/config.js 的 DICT_BASE_URL / DICT_API_KEY 迁来；上线生产时建议改环境变量注入。
dict:
  base-url: https://dict.107.151.233.142.sslip.io/api/v1
  api-key: ${DICT_API_KEY:}
