# 公共配置（T-M1-11）：与环境无关的部分；数据源按环境拆分到 application-dev.yml / application-prod.yml
server:
  port: 3001

spring:
  profiles:
    active: dev
  # 商家上传件上限（F-12/G-01 §2.8）：全仓原无任何 multipart 配置，Spring Boot 默认 1MB，
  # 与 R5 允许的 ≤5MB 冲突——不配则 1~5MB 真实照片会被框架层先行打断。
  # request 上限略高于 file 上限，留 multipart 边界（boundary/表单头）余量。
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# 商家上传落盘目录（F-12/G-01 §2.8 + F-13/G-02 决策①方案 A）：
# dev 值 ../front/static/images/uploads/ —— 相对路径按后端进程工作目录解析，而 mvn spring-boot:run 的工作目录是 backEnd/
# （F-12 实测文件落在 backEnd/uploads/ 就是这条证据），故必须回退一级到仓库根再进 front/；
# 落进 C 端静态根的 uploads 子目录后，dev 由 5173 静态目录直接命中、prod 由 nginx alias /data/fresh/images/ 命中，
# C 端与 nginx 双双零改动（入库值 /static/images/uploads/<名> 与现状 dish.image 同构）。
# prod 由环境变量 FRESH_UPLOAD_DIR 覆盖为 /data/fresh/images/uploads（本文件是环境无关公共配置，application-prod.yml 不动）。
# 消费方两处：MerchantController#uploadDir 落盘、CorsConfig#addResourceHandlers 双映射（/uploads/** 与 /static/images/uploads/**）。
fresh:
  upload-dir: ${FRESH_UPLOAD_DIR:../front/static/images/uploads/}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

# 字典服务上游配置（T-M2-07）：sk_ 密钥只存后端，前端一律走 /api/dict 代理，不再持有 key。
# 【F-42a ③ 更正本段原注释的事实错误，只改注释、两个键与默认值一字未动】此前这里写「现值从
# front/api/config.js 的 DICT_BASE_URL / DICT_API_KEY 迁来」——那两个常量在仓库里根本不存在
# （front/api/config.js:15 自己就写着「已删除」），「迁来」一说无从核对。如实口径：
#   dict.base-url 自 F-53 ① 起可由环境变量 DICT_BASE_URL 覆盖，未注入时落回本文件里这个默认值
#     （它是地址不是密钥，默认值入仓属设计内；默认值串与 F-53 之前逐字相同，所以不注入时行为不变）。
#     为什么要留默认值而不是强制注入：不留则 dev/测试环境没配这个变量时 @Value("${dict.base-url}")
#     解不出占位符、Spring 直接启动失败，而字典这条链本身是有降级分支的（见下面那段
#     「上游不可达 → DictServiceImpl 抛 BizException → 前端降级到内置 FALLBACK 词表」）——
#     换域名该是「改一处配置」，不该要求「改代码 → 重新打包 → 重启」，更不该因为少一枚环境变量把整个后端拖起不来。
#     注意本句的 DICT_BASE_URL 是**后端环境变量**，与上面提到的 front/api/config.js 里那两枚同名前端
#     常量无关（那两枚前端常量至今仍不存在）。
#   dict.api-key 无明文默认值，值只由环境变量 DICT_API_KEY 注入，仓库内不留明文
#   （dev：logs/restart-backend.sh 从 gitignore 排除的 start-local.bat 读出后 export，全程不回显；
#    prod：deploy/fresh.service 只有 DB_PASSWORD/JWT_SECRET/ADMIN_KEY 三行生效的 Environment=，
#          DICT_API_KEY 在那份 unit 里是「故意不给占位值 + 一段为什么必须主动补」的说明形态，
#          照文件补一行才通；不补则线上恒定走下面的失败分支）。
# 未注入 DICT_API_KEY 时的实际行为（下一个读这里的人要知道的就这一句）：api-key 解析成空串 →
# 带空 X-Api-Key 调上游被拒 → DictServiceImpl 吞掉上游细节改抛 BizException("字典服务暂时不可用，请稍后重试")
# → GlobalExceptionHandler 转失败信封（HTTP 仍 200，body.code=400）→ 前端 front/api/dict.js 按失败降级到
# 内置 FALLBACK 词表渲染（页面不白屏，但后台维护的词条拿不到，且失败不写缓存、恢复后自动重试）。
# 【F-46 补一句，防误诊】上面这条 400 分支不是「没注入 key」的专属签名：上游不可达、上游返回结构异常
# 也是同一个对外响应。区分只看日志里的 err= 异常类名，分诊表写在 deploy/fresh.service 的 DICT_API_KEY 段。
dict:
  base-url: ${DICT_BASE_URL:https://dict.107.151.233.142.sslip.io/api/v1}
  api-key: ${DICT_API_KEY:}
