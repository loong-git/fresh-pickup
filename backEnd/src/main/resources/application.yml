# 公共配置（T-M1-11）：与环境无关的部分；数据源按环境拆分到 application-dev.yml / application-prod.yml
server:
  port: 3001

spring:
  profiles:
    active: dev
  # 商家上传件上限（F-12/G-01 §2.8）：全仓原无任何 multipart 配置，Spring Boot 默认 1MB，
  # 与 R5 允许的 ≤5MB 冲突——不配则 1~5MB 真实照片会被框架层先行打断。
  # request 上限略高于 file 上限，留 multipart 边界（boundary/表单头）余量。
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# 商家上传落盘目录（F-12/G-01 §2.8）：dev 默认 ./uploads/（相对后端进程工作目录），
# prod 由环境变量 FRESH_UPLOAD_DIR 覆盖（本文件是环境无关公共配置，application-prod.yml 不动）。
# 消费方两处：MerchantController#uploadDir 落盘、CorsConfig#addResourceHandlers 注册 /uploads/** 静态映射。
fresh:
  upload-dir: ${FRESH_UPLOAD_DIR:./uploads/}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

# 字典服务上游配置（T-M2-07）：sk_ 密钥只存后端，前端一律走 /api/dict 代理，不再持有 key。
# 现值从 front/api/config.js 的 DICT_BASE_URL / DICT_API_KEY 迁来；上线生产时建议改环境变量注入。
dict:
  base-url: https://dict.107.151.233.142.sslip.io/api/v1
  api-key: ${DICT_API_KEY:}
